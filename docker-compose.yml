services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carerelay
      POSTGRES_PASSWORD: carerelay
      POSTGRES_DB: carerelay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carerelay"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://carerelay:carerelay@postgres:5432/carerelay
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CLINICAL_RULES_PATH: /workspace/packages/clinical-rules/demo_v1.yaml
      DEMO_DATA_PATH: /workspace/packages/demo-data/scenarios.json
    ports:
      - "8001:8000"
    volumes:
      - ./packages:/workspace/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_storage:
