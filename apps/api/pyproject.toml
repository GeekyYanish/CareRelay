[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "carerelay-api"
version = "0.1.0"
description = "Safety-first CareRelay hackathon API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "redis>=6.2,<7",
  "qdrant-client>=1.15,<2",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
live-agents = ["google-adk[a2a]>=1.10", "google-genai>=1.30", "lyzr-adk>=0.1"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
