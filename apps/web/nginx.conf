server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Required when proxy_pass uses a variable (API_UPSTREAM from env).
  resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https: ws: wss:; img-src 'self' data:; script-src 'self'";

  location /api/ {
    set $api_upstream "${API_UPSTREAM}";
    client_max_body_size 10m;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 90s;
  }

  location /a2a/ {
    set $api_upstream "${API_UPSTREAM}";
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
  }

  location /mcp {
    set $api_upstream "${API_UPSTREAM}";
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
  }

  location / { try_files $uri /index.html; }
}
