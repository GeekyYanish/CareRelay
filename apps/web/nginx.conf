server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https: ws: wss:; img-src 'self' data:; script-src 'self'";

  location /api/ { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $host; proxy_http_version 1.1; }
  location /a2a/ { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $host; proxy_http_version 1.1; }
  location /mcp { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $host; proxy_http_version 1.1; }
  location / { try_files $uri /index.html; }
}
